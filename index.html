
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz & Joke Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Quiz & Joke Generator</h1>
    <p>Test your knowledge and enjoy a joke!</p>
  </header>

  <main>
    <section class="card">
      <h2>Knowledge Quiz</h2>
      <p id="question">Question will appear here.</p>
      <div id="answers"></div>
      <p id="quiz-result" aria-live="polite"></p>
      <button id="next-btn">Next Question</button>
    </section>

    <section class="card">
      <h2>Random Joke</h2>
      <p id="joke" aria-live="polite">Click below to get a joke.</p>
      <button id="joke-btn">Get a Joke</button>
    </section>
  </main>

  <footer>
    <p>Created for ApexPlanet Internship Task 3</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
